<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('cvforge_theme');
          const dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch {}
      })();
    </script>
    <title>CVForkt - Professional ATS Resume & CV Generator</title>
    <meta name="description" content="Build an ATS-ready professional resume or CV with live preview, styling templates, cloud sync, LinkedIn import, and PDF/DOCX export." />
    <meta name="application-name" content="CVForkt" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#1e3a8a" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />
    <meta property="og:site_name" content="CVForkt" />
    <meta property="og:title" content="CVForkt - Professional ATS Resume & CV Generator" />
    <meta property="og:description" content="Build an ATS-ready professional resume or CV with live preview, styling templates, cloud sync, LinkedIn import, and PDF/DOCX export." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="CVForkt - Professional ATS Resume & CV Generator" />
    <meta name="twitter:description" content="Build an ATS-ready professional resume or CV with live preview, styling templates, cloud sync, LinkedIn import, and PDF/DOCX export." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased min-h-screen">
    <noscript>
      <div style="max-width: 32rem; margin: 4rem auto; padding: 1.5rem; font-family: system-ui, sans-serif; line-height: 1.6;">
        <h1 style="font-size: 1.25rem;">JavaScript is required</h1>
        <p>CVForkt runs entirely in your browser. Enable JavaScript to build and export your resume.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
